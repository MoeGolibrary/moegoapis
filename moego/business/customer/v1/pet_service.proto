syntax = "proto3";

package moego.business.customer.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/type/date.proto";
import "google/type/interval.proto";
import "moego/business/customer/v1/pet.proto";
import "moego/business/setting/v1/pet.proto";
import "moego/common/v1/pagination.proto";
import "moego/common/v1/weight.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/customer/v1/customerpb;customerpb";
option java_multiple_files = true;
option java_outer_classname = "CustomerServiceProto";
option java_package = "com.moego.api.business.customer.v1";

// PetService provides methods for managing pet profiles and their associated data.
// This service handles all aspects of pet management including creation, retrieval,
// and updates to pet information, as well as managing pet-specific notes and codes.
service PetService {
  // Creates a new pet profile in the system.
  //
  // This method validates and stores the pet's information, including basic details,
  // health records, and any initial notes or codes. The pet is automatically
  // associated with the specified customer.
  //
  // Returns the created Pet object with all fields populated.
  // Throws INVALID_ARGUMENT if required fields are missing or invalid.
  rpc CreatePet(CreatePetRequest) returns (CreatePetResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{customer_id}/pets"
      body: "*"
    };
  }
  // Updates an existing pet's information.
  //
  // Modifies the details of an existing pet, including basic information,
  // health records, and any associated notes or codes.
  //
  // Returns the updated Pet object with all fields populated.
  // Throws NOT_FOUND if the pet ID or customer ID doesn't exist.
  // Throws INVALID_ARGUMENT if provided fields are invalid.
  rpc UpdatePet(UpdatePetRequest) returns (Pet) {
    option (google.api.http) = {
      put: "/v1/customers/{customer_id}/pets/{id}"
      body: "*"
    };
  }

  // Retrieves detailed information about a specific pet.
  //
  // Returns all pet data including health records, notes, and service history.
  // Throws NOT_FOUND if the pet ID or customer ID doesn't exist.
  rpc GetPet(GetPetRequest) returns (Pet) {
    option (google.api.http) = {get: "/v1/customers/{customer_id}/pets/{id}"};
  }

  // Lists all pets belonging to a specific customer.
  //
  // Returns a list of pet profiles associated with the customer.
  // Returns an empty list if the customer has no pets.
  rpc ListPets(ListPetsRequest) returns (ListPetsResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{customer_id}/pets:list"
      body: "*"
    };
  }

  // Adds special handling codes or medical alerts to a pet's profile.
  //
  // These codes are displayed prominently during service delivery to ensure
  // appropriate handling and care. Returns the newly added codes.
  // Throws NOT_FOUND if the pet ID or customer ID doesn't exist.
  rpc AppendPetCodes(AppendPetCodesRequest) returns (AppendPetCodesResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{customer_id}/pets/{id}/codes"
      body: "*"
    };
  }

  // Adds new notes to a pet's profile.
  //
  // Notes can include observations about behavior, preferences, or special
  // requirements. Returns the newly created notes with generated IDs.
  // Throws NOT_FOUND if the pet ID or customer ID doesn't exist.
  rpc AppendPetNotes(AppendPetNotesRequest) returns (AppendPetNotesResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{customer_id}/pets/{id}/notes"
      body: "*"
    };
  }

  // Retrieves a paginated list of notes for a specific pet.
  //
  // Notes are returned in reverse chronological order (newest first).
  // Returns an empty list if the pet has no notes.
  rpc ListPetNotes(ListPetNotesRequest) returns (ListPetNotesResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{customer_id}/pets/{id}/notes:list"
      body: "*"
    };
  }

  // Lists all pets across all customers in the company.
  //
  // Results can be filtered by customer IDs and are paginated.
  // Requires company-level access permissions.
  rpc ListAllPets(ListAllPetsRequest) returns (ListAllPetsResponse) {
    option (google.api.http) = {
      post: "/v1/pets:list"
      body: "*"
    };
  }
}

// Request message for creating a new pet profile.
message CreatePetRequest {
  // ID of the customer who owns the pet
  // Required. Must be a valid customer ID
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Complete pet information to be created
  // Required. Must include all required pet fields
  Pet pet = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for creating a new pet profile.
message CreatePetResponse {
  // The newly created pet profile
  // Includes system-generated fields like ID
  Pet pet = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for updating a pet's profile.
message UpdatePetRequest {
  // ID of the customer who owns the pet
  // Required. Must be a valid customer ID
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier for the pet
  // Format: "pet_" followed by random characters
  string id = 2 [(google.api.field_behavior) = REQUIRED];

  // Pet's given name
  // Optional. If not provided, current value will be retained
  optional string name = 3;

  // Pet's date of birth
  // Optional. If not provided, current value will be retained
  optional google.type.Date birthday = 4;

  // Species of the pet
  // Optional. If not provided, current value will be retained
  optional Pet.Type type = 5;

  // Specific breed within the pet type
  // Optional. If not provided, current value will be retained
  optional string breed = 6;

  // Pet's gender
  // Optional. If not provided, current value will be retained
  optional Pet.Gender gender = 7;

  // Pet's current weight
  // Optional. If not provided, current value will be retained
  optional moego.common.v1.Weight weight = 8;

  // Spay/neuter status
  // Values: "yes", "no", "unknown"
  // Optional. If not provided, current value will be retained
  optional string fixed = 9;

  // Description of the pet's coat
  // Example: "long double coat", "short hair"
  // Optional. If not provided, current value will be retained
  optional string coat = 10;

  // General temperament and behavior notes
  // Example: "friendly", "nervous with new people"
  // Optional. If not provided, current value will be retained
  optional string behavior = 11;

  // Primary veterinary care provider
  // Used for emergencies and health verifications
  // Optional. If not provided, current value will be retained
  optional Pet.Vet vet = 12;

  // Current evaluation status for services
  // Determines service availability
  optional Pet.EvaluationStatus evaluation_status = 13;

  // photo url of pet.
  optional string photo = 14;
}

// Request message for retrieving a specific pet.
message GetPetRequest {
  // ID of the customer who owns the pet
  // Required. Must be a valid customer ID
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier of the pet to retrieve
  // Required. Format: "pet_" followed by random characters
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for listing a customer's pets.
message ListPetsRequest {
  // ID of the customer whose pets to list
  // Required. Must be a valid customer ID
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing a customer's pets.
message ListPetsResponse {
  // List of pets belonging to the customer
  // May be empty if the customer has no pets
  repeated Pet pets = 1;
}

// Request message for adding codes to a pet's profile.
message AppendPetCodesRequest {
  // ID of the customer who owns the pet
  // Required. Must be a valid customer ID
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier of the pet
  // Required. Format: "pet_" followed by random characters
  string id = 2 [(google.api.field_behavior) = REQUIRED];

  // IDs of the codes to add to the pet's profile
  // Required. Must be valid code IDs
  repeated string pet_code_ids = 3 [(google.api.field_behavior) = REQUIRED];
}

// Response message for adding codes to a pet's profile.
message AppendPetCodesResponse {
  // Codes that were successfully added
  // Includes full code details
  repeated moego.business.setting.v1.PetCode codes = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for adding notes to a pet's profile.
message AppendPetNotesRequest {
  // ID of the customer who owns the pet
  // Required. Must be a valid customer ID
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier of the pet
  // Required. Format: "pet_" followed by random characters
  string id = 2 [(google.api.field_behavior) = REQUIRED];

  // Notes to add to the pet's profile
  // Required. At least one note must be provided
  repeated Pet.Note notes = 3;
}

// Response message for adding notes to a pet's profile.
message AppendPetNotesResponse {
  // Notes that were successfully added
  // Includes generated IDs and timestamps
  repeated Pet.Note notes = 1;
}

// Request message for listing a pet's notes.
message ListPetNotesRequest {
  // Pagination parameters for the request
  // Required. Defines page size and token for continuation
  moego.common.v1.Pagination pagination = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the customer who owns the pet
  // Required. Must be a valid customer ID
  string customer_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier of the pet
  // Required. Format: "pet_" followed by random characters
  string id = 3 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing a pet's notes.
message ListPetNotesResponse {
  // Token for retrieving the next page of results
  // Empty if there are no more results
  string next_page_token = 1;

  // List of notes for the pet
  // May be empty if the pet has no notes
  repeated Pet.Note notes = 2;
}

// Request message for listing all pets in the company.
message ListAllPetsRequest {
  // Pagination parameters for the request
  // Required. Defines page size and token for continuation
  moego.common.v1.Pagination pagination = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the company to list pets for
  // Required. Must be a valid company ID
  string company_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Filter parameters for the pet list
  message Filter {
    // Optional list of customer IDs to filter by
    // If provided, only returns pets belonging to these customers
    repeated string customer_ids = 1 [(google.api.field_behavior) = OPTIONAL];

    // Optional list of time intervals to filter by
    // If provided, only returns pets with appointments within these intervals
    google.type.Interval last_updated_time = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // Optional filters to apply to the pet list
  Filter filter = 3;
}

// Response message for listing all pets.
message ListAllPetsResponse {
  // Token for retrieving the next page of results
  // Empty if there are no more results
  string next_page_token = 1;

  // List of pets matching the request criteria
  // May be empty if no pets match
  repeated Pet pets = 2;
}
