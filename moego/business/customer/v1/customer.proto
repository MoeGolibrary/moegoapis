syntax = "proto3";

package moego.business.customer.v1;

import "google/protobuf/timestamp.proto";
import "moego/business/setting/v1/customer.proto";
import "moego/common/v1/address.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/customer/v1/customerpb;customerpb";
option java_multiple_files = true;
option java_outer_classname = "CustomerProto";
option java_package = "com.moego.api.business.customer.v1";

// ComplianceChannel represents the available communication channels for customer notifications.
// These channels are used to control how customers receive service-related and marketing communications.
enum ComplianceChannel {
  // COMPLIANCE_CHANNEL_UNSPECIFIED indicates an unknown or invalid channel.
  COMPLIANCE_CHANNEL_UNSPECIFIED = 0;

  // COMPLIANCE_CHANNEL_SMS indicates communication via SMS text messages.
  COMPLIANCE_CHANNEL_SMS = 1;

  // COMPLIANCE_CHANNEL_EMAIL indicates communication via email.
  COMPLIANCE_CHANNEL_EMAIL = 2;

  // COMPLIANCE_CHANNEL_AUTO_CALL indicates communication via automated phone calls.
  COMPLIANCE_CHANNEL_AUTO_CALL = 3;
}

// CustomerComplianceConfig stores customer's compliance and communication preferences.
// This configuration controls which channels can be used to contact the customer
// for different types of communications.
message CustomerComplianceConfig {
  // Communication channels allowed for service-related notifications
  repeated ComplianceChannel service_related_channels = 2;

  // Communication channels allowed for marketing campaigns
  repeated ComplianceChannel marketing_campaigns_channels = 3;

  // Whether the customer has enabled the branded mobile app for notifications
  bool branded_app_enabled = 4;

  // Whether the customer has agreed to receive marketing communications
  // This must be true before sending any marketing-related messages
  bool is_agreed_marketing_policy = 6;
}

// CustomerComplianceConfigUpdateDef defines updates to customer compliance configuration.
// All fields are optional to support partial updates.
message CustomerComplianceConfigUpdateDef {
  // ComplianceChannelListUpdateDef wraps a list of compliance channels for updates.
  message ComplianceChannelListUpdateDef {
    // List of communication channels to set
    // If an empty list is provided, the corresponding configuration will be cleared
    repeated ComplianceChannel channels = 1;
  }

  // Update service-related notification channels
  // If set, replaces all existing service-related channels
  optional ComplianceChannelListUpdateDef service_related_channels = 2;

  // Update marketing campaign notification channels
  // If set, replaces all existing marketing campaign channels
  optional ComplianceChannelListUpdateDef marketing_campaigns_channels = 3;

  // Update whether branded app notifications are enabled
  optional bool branded_app_enabled = 4;

  // Update whether customer has agreed to marketing policy
  optional bool is_agreed_marketing_policy = 5;
}

// Customer represents a client who uses your services. A customer can have multiple pets,
// appointments, and preferences. Customers are the core entity in the pet service business
// and are used throughout the system for booking appointments, managing pets, and tracking
// service history.
message Customer {
  // Status represents the current state of a customer's account.
  // This affects their ability to book appointments and access services.
  enum Status {
    // STATUS_UNSPECIFIED indicates an unknown or invalid status.
    // New customers should not be created with this status.
    STATUS_UNSPECIFIED = 0;

    // ACTIVE indicates the customer can book appointments and use services.
    // This is the default status for new customers.
    ACTIVE = 1;

    // INACTIVE indicates the customer cannot book new appointments.
    // Existing appointments may still be honored based on business policy.
    INACTIVE = 2;
  }

  // Note represents a comment or observation about a customer.
  // Notes help track important customer information, preferences, and history.
  message Note {
    // Unique identifier for this note
    string id = 1;

    // The content of the note
    string note = 2;

    // ID of the staff member who last modified this note
    string last_updated_by = 3;

    // When this note was last modified
    google.protobuf.Timestamp last_updated_time = 4;
  }

  // Preference stores a customer's communication and marketing preferences.
  // These settings determine how and when we can contact the customer.
  message Preference {
    // Whether the customer wants to receive automated SMS messages
    // Default: true
    bool receive_auto_message = 1;

    // Whether the customer wants to receive automated emails
    // Default: true
    bool receive_auto_email = 2;

    // Whether the customer has opted in to marketing emails
    // Default: false
    bool subscribe_to_marketing_emails = 3;

    // Whether the customer wants appointment reminders
    // Default: true
    bool receive_appointment_reminder = 4;
  }

  // Unique identifier for the customer
  // Format: "cus_" followed by random characters
  string id = 1;

  // Original raw identifier for the customer in product
  int64 raw_id = 25;

  // Customer's first name
  string first_name = 2;

  // Customer's last name
  string last_name = 3;

  // URL to the customer's profile picture
  // Optional. Must be a valid HTTPS URL
  string avatar = 4;

  // Customer's phone number
  // Format: E.164 format (e.g., +12125551234)
  string phone = 5;

  // Customer's email address
  // Format: Must be a valid email address
  string email = 6;

  // List of customer's addresses
  // Can include home, work, or other addresses
  repeated moego.common.v1.Address address = 7;

  // Current status of the customer's account
  Status status = 8;

  // Color code for visual identification in the UI
  // Format: Hex color code (e.g., "#FF0000")
  string color_code = 9;

  // How the customer was acquired
  // Examples: "referral", "website", "walk-in"
  string source = 10;

  // When the customer last had an appointment
  google.protobuf.Timestamp last_appointment_date = 11;

  // When the customer's next appointment is scheduled
  google.protobuf.Timestamp next_appointment_date = 12;

  // ID of the staff member who created this customer
  string created_by = 13;

  // When this customer was created
  google.protobuf.Timestamp created_time = 14;

  // ID of the staff member who last modified this customer
  string last_updated_by = 15;

  // When this customer was last modified
  google.protobuf.Timestamp last_updated_time = 16;

  // ID of the customer's preferred business location
  string preferred_business_id = 17;

  // ID of the company this customer belongs to
  string company_id = 18;

  // List of notes about this customer
  repeated Note notes = 19;

  // List of tags applied to this customer
  repeated moego.business.setting.v1.CustomerTag tags = 20;

  // The source or channel through which a customer was acquired.
  moego.business.setting.v1.ReferralSource referral_source = 21;

  // Preferences related to communication and marketing.
  Preference preference = 22;

  // URL to a page where the customer can view their upcoming appointments
  string upcoming_appointments_url = 23;

  // Flag indicating if this customer record is deleted
  bool deleted = 24;

  // Customer's compliance configuration for communication channels
  // Controls which channels can be used for different types of communications
  CustomerComplianceConfig compliance_config = 26;
}
