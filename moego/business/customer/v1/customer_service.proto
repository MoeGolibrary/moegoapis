syntax = "proto3";

package moego.business.customer.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/type/date.proto";
import "google/type/interval.proto";
import "models/business_customer/v1/business_pet.proto";
import "models/customer/v1/pet.proto";
import "models/offering/v1/service.proto";
import "moego/business/customer/v1/customer.proto";
import "moego/business/setting/v1/customer.proto";
import "moego/common/v1/address.proto";
import "moego/common/v1/pagination.proto";
import "validate/validate.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/customer/v1/customerpb;customerpb";
option java_multiple_files = true;
option java_outer_classname = "CustomerServiceProto";
option java_package = "com.moego.api.business.customer.v1";

// CustomerService provides methods for managing customer data, including creation,
// retrieval, and management of customer-related information such as notes and tags.
// All operations require appropriate authentication and authorization.
service CustomerService {
  // Creates a new customer in the system.
  //
  // This method validates and stores customer information, including basic details,
  // preferences, and any initial tags or notes. A unique customer ID is generated
  // and returned in the response.
  //
  // Returns the created Customer object with all fields populated.
  // Throws INVALID_ARGUMENT if required fields are missing or invalid.
  rpc CreateCustomer(CreateCustomerRequest) returns (Customer) {
    option (google.api.http) = {
      post: "/v1/customers"
      body: "*"
    };
  }

  // Updates an existing customer's information.
  //
  // Modifies the details of an existing customer, including basic information,
  // preferences, and optionally updating associated tags or notes.
  //
  // Returns the updated Customer object with all fields populated.
  // Throws NOT_FOUND if the customer ID doesn't exist.
  // Throws INVALID_ARGUMENT if provided fields are invalid.
  rpc UpdateCustomer(UpdateCustomerRequest) returns (Customer) {
    option (google.api.http) = {
      put: "/v1/customers/{id}"
      body: "*"
    };
  }

  // Retrieves detailed information about a specific customer.
  //
  // Returns all customer data including preferences, notes, tags, and appointment history.
  // Throws NOT_FOUND if the customer ID doesn't exist.
  rpc GetCustomer(GetCustomerRequest) returns (Customer) {
    option (google.api.http) = {get: "/v1/customers/{id}"};
  }

  // Aggregated customer & pet profile lookup by phone number for AI/receptionist scenarios.
  //
  // This is a read-only aggregation API to support third-party AI platforms:
  // - resolve customer by phone within a business
  // - return customer minimal profile
  // - return all pets with feeding / medication / vaccine information
  // - return last & next appointments with basic service details
  rpc GetClientPetProfileByPhone(GetClientPetProfileByPhoneParams) returns (GetClientPetProfileByPhoneResult) {
    option (google.api.http) = {
      post: "/v1/customers:clientPetProfileByPhone"
      body: "*"
    };
  }

  // Lists customers matching the specified criteria.
  //
  // Results are paginated and can be filtered by last update time.
  // Returns an empty list if no customers match the criteria.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (google.api.http) = {
      post: "/v1/customers:list"
      body: "*"
    };
  }

  // Generates a secure link for adding customer card-on-file information.
  //
  // The generated link is valid for 24 hours and can only be used once.
  // Throws NOT_FOUND if the customer ID doesn't exist.
  rpc GenCustomerCofLink(GenCustomerCofLinkRequest) returns (GenCustomerCofLinkResponse) {
    option (google.api.http) = {get: "/v1/customers/{id}/cof/link"};
  }

  // Adds new notes to a customer's profile.
  //
  // Notes are timestamped and attributed to the staff member who created them.
  // Returns the newly created notes with generated IDs.
  // Throws NOT_FOUND if the customer ID doesn't exist.
  rpc AppendCustomerNotes(AppendCustomerNotesRequest) returns (AppendCustomerNotesResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{id}/notes"
      body: "*"
    };
  }

  // Retrieves a paginated list of notes for a specific customer.
  //
  // Notes are returned in reverse chronological order (newest first).
  // Returns an empty list if the customer has no notes.
  rpc ListCustomerNotes(ListCustomerNotesRequest) returns (ListCustomerNotesResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{id}/notes:list"
      body: "*"
    };
  }

  // Adds new tags to a customer's profile.
  //
  // Tags help categorize customers and can be used for filtering and reporting.
  // Returns the newly created tags with generated IDs.
  // Throws NOT_FOUND if the customer ID doesn't exist.
  rpc AppendCustomerTags(AppendCustomerTagsRequest) returns (AppendCustomerTagsResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{id}/tags"
      body: "*"
    };
  }

  // Retrieves all tags associated with a specific customer.
  //
  // Returns an empty list if the customer has no tags.
  // Throws NOT_FOUND if the customer ID doesn't exist.
  rpc ListCustomerTags(ListCustomerTagsRequest) returns (ListCustomerTagsResponse) {
    option (google.api.http) = {
      post: "/v1/customers/{id}/tags:list"
      body: "*"
    };
  }
}

// Request message for creating a new customer.
message CreateCustomerRequest {
  // ID of the company creating the customer
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the business location preferred by the customer
  // Required. Must be a valid business ID within the company
  string preferred_business_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Customer's first name
  string first_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Customer's last name
  string last_name = 4 [(google.api.field_behavior) = REQUIRED];

  // Customer's phone number
  // Required. Must be in E.164 format (e.g., +12125551234)
  string phone = 5 [(google.api.field_behavior) = REQUIRED];

  // Customer's email address
  // Optional. Must be a valid email address if provided
  string email = 6;

  // Customer's primary address
  // Optional. Must be a valid address if provided
  moego.common.v1.Address address = 7;

  // Customer's communication and marketing preferences
  // Optional. System defaults will be used if not provided
  Customer.Preference preference = 8;

  // Initial tags to apply to the customer
  // Optional. Empty list if not provided
  repeated moego.business.setting.v1.CustomerTag tags = 9;

  // Initial notes about the customer
  // Optional. Empty list if not provided
  repeated Customer.Note notes = 10;

  // Customer's compliance configuration for communication channels
  // Optional. System defaults will be used if not provided
  optional CustomerComplianceConfigUpdateDef compliance_config = 11;
}

// Request message for updating a customer.
message UpdateCustomerRequest {
  // Unique identifier of the customer to update
  // Required. Format: "cus_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the company that owns the customer
  // Required. Must be a valid company ID
  string company_id = 2 [(google.api.field_behavior) = REQUIRED];

  // ID of the business location preferred by the customer
  // Optional. If not provided, current value will be retained
  optional string preferred_business_id = 3;

  // avatar path, optional
  // Optional. If not provided, current value will be retained
  optional string avatar_path = 4;

  // first name, optional
  // Optional. If not provided, current value will be retained
  optional string first_name = 5;

  // last name, optional
  // Optional. If not provided, current value will be retained
  optional string last_name = 6;

  // Customer's phone number
  // Optional. If not provided, current value will be retained
  optional string phone = 7 [(google.api.field_behavior) = REQUIRED];

  // email, optional
  // Optional. If not provided, current value will be retained
  optional string email = 8;

  // Customer's primary address
  // Optional. If not provided, current value will be retained
  optional moego.common.v1.Address address = 9;

  // Initial tags to apply to the customer
  // Optional. Empty list if not provided
  repeated moego.business.setting.v1.CustomerTag tags = 10;

  // Initial notes about the customer
  // Optional. Empty list if not provided
  repeated Customer.Note notes = 11;

  // Customer's compliance configuration updates
  // Optional. If not provided, current configuration will be retained
  optional CustomerComplianceConfigUpdateDef compliance_config = 12;
}

// Request message for retrieving a specific customer.
message GetCustomerRequest {
  // Unique identifier of the customer to retrieve
  // Required. Format: "cus_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for listing customers.
message ListCustomersRequest {
  // Pagination parameters for the request
  // Required. Defines page size and token for continuation
  moego.common.v1.Pagination pagination = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the company to list customers for
  // Required. Must be a valid company ID
  string company_id = 2 [(google.api.field_behavior) = REQUIRED];

  // Filter parameters for the customer list
  message Filter {
    // Time range for filtering customers by last update time
    // Optional. If not provided, returns all customers
    google.type.Interval last_updated_time = 1 [(google.api.field_behavior) = OPTIONAL];

    // Main phone number for filtering customers
    // Optional. If not provided, returns all customers
    string main_phone_number = 2 [(google.api.field_behavior) = OPTIONAL];
  }

  // Optional filters to apply to the customer list
  Filter filter = 3;
}

// Response message for listing customers.
message ListCustomersResponse {
  // Token for retrieving the next page of results
  // Empty if there are no more results
  string next_page_token = 1;

  // List of customers matching the request criteria
  // May be empty if no customers match
  repeated Customer customers = 2;
}

// Request message for generating a card-on-file link.
message GenCustomerCofLinkRequest {
  // Unique identifier of the customer
  // Required. Format: "cus_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for generating a card-on-file link.
message GenCustomerCofLinkResponse {
  // Secure URL for adding card-on-file information
  // Valid for 24 hours from generation
  string link = 1;
}

// Request message for adding notes to a customer.
message AppendCustomerNotesRequest {
  // Unique identifier of the customer
  // Required. Format: "cus_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // Notes to add to the customer's profile
  // Required. At least one note must be provided
  repeated Customer.Note notes = 3;
}

// Response message for adding notes to a customer.
message AppendCustomerNotesResponse {
  // Notes that were successfully added
  // Includes generated IDs and timestamps
  repeated Customer.Note notes = 1;
}

// Request message for listing customer notes.
message ListCustomerNotesRequest {
  // Pagination parameters for the request
  // Required. Defines page size and token for continuation
  moego.common.v1.Pagination pagination = 1 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier of the customer
  // Required. Format: "cus_" followed by random characters
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing customer notes.
message ListCustomerNotesResponse {
  // Token for retrieving the next page of results
  // Empty if there are no more results
  string next_page_token = 1;

  // List of notes for the customer
  // May be empty if the customer has no notes
  repeated Customer.Note notes = 2;
}

// Request message for adding tags to a customer.
message AppendCustomerTagsRequest {
  // Unique identifier of the customer
  // Required. Format: "cus_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // Tags to add to the customer's profile
  // Required. At least one tag must be provided
  repeated moego.business.setting.v1.CustomerTag tags = 3;
}

// Response message for adding tags to a customer.
message AppendCustomerTagsResponse {
  // Tags that were successfully added
  // Includes generated IDs and timestamps
  repeated moego.business.setting.v1.CustomerTag tags = 1;
}

// Request message for listing customer tags.
message ListCustomerTagsRequest {
  // Unique identifier of the customer
  // Required. Format: "cus_" followed by random characters
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing customer tags.
message ListCustomerTagsResponse {
  // List of tags associated with the customer
  // May be empty if the customer has no tags
  repeated moego.business.setting.v1.CustomerTag tags = 2;
}

// Query client and pet profile by phone for receptionist/AI scenarios.
message GetClientPetProfileByPhoneParams {
  // phone number, normalized by caller.
  string phone_number = 1 [(validate.rules).string = {
    min_len: 7
    max_len: 30
  }];

  // business id, book appointment for this business.
  int64 business_id = 2 [(validate.rules).int64.gt = 0];
}

// Query client and pet profile by phone result.
message GetClientPetProfileByPhoneResult {
  // minimal customer profile view for receptionist.
  message CustomerView {
    // customer id
    int64 customer_id = 1;
    // first name
    string first_name = 2;
    // last name
    string last_name = 3;
    // phone number
    string phone_number = 4;
    // email
    optional string email = 5;
  }

  // pet profile with care/vaccine details.
  message PetView {
    // pet id
    int64 pet_id = 1;
    // pet name
    string pet_name = 2;
    // pet type
    models.customer.v1.PetType pet_type = 3;
    // breed
    string breed = 4;
    // breed mixed
    bool breed_mixed = 5;
    // gender
    models.customer.v1.PetGender gender = 6;
    // weight
    string weight = 7;
    // coat type
    string coat_type = 8;
    // fixed
    string fixed = 9;
    // birthday
    google.type.Date birthday = 10;
    // evaluation status
    models.customer.v1.EvaluationStatus evaluation_status = 11;
    // feeding schedules
    repeated models.business_customer.v1.BusinessPetFeedingScheduleView feeding_schedules = 21;
    // medication schedules
    repeated models.business_customer.v1.BusinessPetMedicationScheduleView medication_schedules = 22;
    // vaccine records
    repeated models.business_customer.v1.BusinessPetVaccineRecordModel vaccine_list = 23;
  }

  // service detail in one appointment.
  message ServiceDetailView {
    // service id
    int64 service_id = 1;
    // service name
    string service_name = 2;
    // service item type
    models.offering.v1.ServiceItemType service_item_type = 3;
    // service duration in minutes
    int32 service_time = 4;
    // service price
    double service_price = 5;
    // assigned staff
    optional int64 staff_id = 6;
    // assigned lodging
    optional int64 lodging_id = 7;
  }

  // pet and its services in one appointment.
  message PetServiceDetailView {
    // pet id
    int64 pet_id = 1;
    // selected services
    repeated ServiceDetailView services = 3;
  }

  // minimal appointment summary for recommendation.
  message AppointmentView {
    // appointment id
    int64 appointment_id = 1;
    // start date
    google.type.Date start_date = 2;
    // start time in minutes from midnight
    int32 start_time = 3;
    // end date
    google.type.Date end_date = 4;
    // end time in minutes from midnight
    int32 end_time = 5;
    // main care type
    models.offering.v1.ServiceItemType main_care_type = 6;
    // pet + services details
    repeated PetServiceDetailView pet_service_details = 11;
  }

  // matched customer profile.
  optional CustomerView customer = 1;
  // matched pets under this customer with feeding/medication/vaccine details.
  repeated PetView pets = 2;
  // customer's last appointment.
  optional AppointmentView last_appointment = 3;
  // customer's next appointment.
  optional AppointmentView next_appointment = 4;
}

