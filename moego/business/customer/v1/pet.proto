syntax = "proto3";

package moego.business.customer.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "moego/business/setting/v1/pet.proto";
import "moego/common/v1/weight.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/customer/v1/customerpb;customerpb";
option java_multiple_files = true;
option java_outer_classname = "PetProto";
option java_package = "com.moego.api.business.customer.v1";

// Pet represents a customer's pet that receives services at your business.
// Each pet has its own profile containing essential information for providing
// appropriate care, including health records, behavior notes, and service preferences.
message Pet {
  // Type defines the species of the pet.
  // This helps determine appropriate services, care requirements, and pricing.
  enum Type {
    // Unknown or unspecified pet type
    TYPE_UNSPECIFIED = 0;

    // Pet type not listed in standard categories
    // Requires special handling and service customization
    OTHER = 1;

    // Canine companion
    // Common breeds include Labrador, German Shepherd, Golden Retriever
    DOG = 2;

    // Feline companion
    // Includes all domestic cat breeds
    CAT = 3;

    // Avian pet
    // Includes parrots, canaries, finches, etc.
    BIRD = 4;

    // Domestic rabbit
    // Requires specific grooming and handling techniques
    RABBIT = 5;

    // Guinea pig
    // Small rodent requiring gentle handling
    GUINEA_PIG = 6;

    // Equine
    // Requires specialized facilities and care
    HORSE = 7;

    // Hamster
    // Small rodent with specific handling needs
    HAMSTER = 8;

    // Rat
    // Intelligent rodent requiring social interaction
    RAT = 9;

    // Mouse
    // Small rodent needing careful handling
    MOUSE = 10;

    // Chinchilla
    // Requires special dust baths and temperature control
    CHINCHILLA = 11;
  }

  // Status indicates whether the pet is currently receiving services.
  // This affects appointment scheduling and service availability.
  enum Status {
    // Unknown or unspecified status
    STATUS_UNSPECIFIED = 0;

    // Pet is currently receiving services
    // Default status for new pets
    ALIVE = 1;

    // Pet is no longer receiving services
    // Historical records are maintained
    PASSED_AWAY = 2;
  }

  // Gender of the pet
  // Used for appropriate service assignment and medical considerations
  enum Gender {
    // Unknown or unspecified gender
    GENDER_UNSPECIFIED = 0;

    // Male pet
    // May require specific handling or service modifications
    MALE = 1;

    // Female pet
    // May require specific handling or service modifications
    FEMALE = 2;

    // Gender not determined or disclosed
    UNKNOWN = 3;
  }

  // Note contains observations about the pet's behavior,
  // preferences, or special requirements
  message Note {
    // Unique identifier for this note
    string id = 1;

    // The content of the note
    string content = 2;

    // ID of the staff member who last modified this note
    string last_updated_by = 3;

    // When this note was last modified
    google.protobuf.Timestamp last_updated_time = 4;
  }

  // Vaccination record for the pet
  // Used to ensure compliance with service requirements
  message Vaccination {
    // Name of the vaccination
    // Example: "Rabies", "DHPP", "Bordetella"
    string name = 1;

    // When this vaccination expires
    // Staff are notified before expiration
    google.protobuf.Timestamp expired_at = 2;
  }

  // Veterinary care provider information
  // Used for emergencies and health verifications
  message Vet {
    // Name of the veterinary practice or doctor
    string name = 2;

    // Contact number for the veterinarian
    // Format: E.164 format (e.g., +12125551234)
    string phone_number = 3;

    // Physical location of the veterinary practice
    string address = 4;
  }

  // Status of the pet's evaluation for services
  // Determines which services can be provided
  enum EvaluationStatus {
    // Evaluation status not yet determined
    EVALUATION_STATUS_UNSPECIFIED = 0;

    // Pet has passed evaluation and can receive services
    PASS = 1;

    // Pet requires modifications to receive services
    FAIL = 2;
  }

  // Unique identifier for the pet
  // Format: "pet_" followed by random characters
  string id = 1;

  // Original raw identifier for the pet in product
  int64 raw_id = 22;

  // Pet's given name
  string name = 2 [(google.api.field_behavior) = REQUIRED];

  // Pet's date of birth
  // Used for age-appropriate service modifications
  google.type.Date birthday = 3;

  // Current status of the pet
  Status status = 4;

  // Species of the pet
  // Required. Determines available services
  Type type = 5 [(google.api.field_behavior) = REQUIRED];

  // Specific breed within the pet type
  // Required. Helps determine grooming requirements
  string breed = 6 [(google.api.field_behavior) = REQUIRED];

  // Pet's gender
  // Used for service assignments
  Gender gender = 7;

  // Pet's current weight
  // Used for equipment selection and health monitoring
  moego.common.v1.Weight weight = 8;

  // Spay/neuter status
  // Values: "yes", "no", "unknown"
  string fixed = 9;

  // Description of the pet's coat
  // Example: "long double coat", "short hair"
  string coat = 10;

  // General temperament and behavior notes
  // Example: "friendly", "nervous with new people"
  string behavior = 11;

  // Special handling codes for this pet
  // Displayed prominently during service
  repeated moego.business.setting.v1.PetCode pet_codes = 12;

  // Staff observations and special instructions
  repeated Note notes = 13;

  // Current vaccination records
  // Required for certain services
  repeated Vaccination vaccinations = 14;

  // ID of the pet's owner
  // System-managed, do not set manually
  string customer_id = 15 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Primary veterinary care provider
  // Used for emergencies and health verifications
  Vet vet = 16;

  // Current evaluation status for services
  // Determines service availability
  EvaluationStatus evaluation_status = 17;

  // timestamp, When the pet was created.
  google.protobuf.Timestamp created_time = 18;

  // timestamp, When the pet was last modified.
  google.protobuf.Timestamp last_updated_time = 19;

  // photo url of pet.
  string photo = 20;

  // Flag indicating if this pet record is deleted.
  bool deleted = 21;
}

// PetScheduleTimeDef defines a schedule time in minutes from midnight.
// E.g. 09:00 AM = 540, 09:30 AM = 570. Range 0–1440.
message PetScheduleTimeDef {
  // Schedule time in minutes from midnight.
  int32 schedule_time = 1;
  // Extra key-value data (e.g. schedule time label).
  map<string, string> extra_json = 2;
}

// PetFeedingSchedule represents a pet's feeding schedule for care instructions.
message PetFeedingSchedule {
  // Feeding record id.
  int64 id = 1;
  // Pet id.
  int64 pet_id = 2;
  // Feeding amount, e.g. "1.2", "1/2", "1".
  string feeding_amount = 3;
  // Feeding unit (pet_metadata.metadata_value, metadata_name = 2).
  string feeding_unit = 4;
  // Feeding type (pet_metadata.metadata_value, metadata_name = 3).
  string feeding_type = 5;
  // Feeding source (pet_metadata.metadata_value, metadata_name = 4).
  string feeding_source = 6;
  // Feeding instruction (pet_metadata.metadata_value, metadata_name = 5).
  optional string feeding_instruction = 7;
  // Feeding times in minutes from midnight. 09:00 AM = 540, 09:30 AM = 570, etc.
  repeated PetScheduleTimeDef feeding_times = 8;
  // Feeding note.
  optional string feeding_note = 9;
}

// PetMedicationSchedule represents a pet's medication schedule for care instructions.
message PetMedicationSchedule {
  // Medication record id.
  int64 id = 1;
  // Pet id.
  int64 pet_id = 2;
  // Medication amount, e.g. "1.2", "1/2", "1".
  string medication_amount = 3;
  // Medication unit (pet_metadata.metadata_value, metadata_name = 7).
  string medication_unit = 4;
  // Medication name (user input).
  string medication_name = 5;
  // Medication note (user input).
  string medication_note = 6;
  // Medication times in minutes from midnight. 09:00 AM = 540, 09:30 AM = 570, etc.
  repeated PetScheduleTimeDef medication_times = 7;
}
