syntax = "proto3";

package moego.business.message.v1;

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/message/v1/messagepb;messagepb";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option java_package = "com.moego.api.business.message.v1";

// Delivery method (channel) for sending messages to the customer.
// Numeric values align with product: 1-msg, 2-email, 4-call, 5-app (3 reserved).
enum MessageDeliveryMethod {
  // Unknown or unspecified delivery method.
  MESSAGE_DELIVERY_METHOD_UNSPECIFIED = 0;
  // In-app / internal message (msg).
  MSG = 1;
  // Email.
  EMAIL = 2;
  // Phone call (call).
  CALL = 4;
  // App push or in-app (app).
  APP = 5;
}
