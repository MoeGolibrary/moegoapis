syntax = "proto3";

package moego.business.message.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "moego/business/message/v1/message.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/message/v1/messagepb;messagepb";
option java_multiple_files = true;
option java_outer_classname = "MessageServiceProto";
option java_package = "com.moego.api.business.message.v1";

// MessageService provides customer messaging and conversation thread lifecycle.
//
// Sending a message to a customer (SendMessageToCustomer) ensures a conversation thread
// exists for that customer (creates one if needed), then delivers the message via the
// specified channel (msg, email, call, app). Callers do not manage threads separately.
service MessageService {
  // Sends a message to a customer.
  //
  // Creates or reuses a conversation thread for the customer, then sends the message
  // using the given delivery method (msg / email / call / app). The message body and
  // type (text or pic) are supplied by the caller; thread creation is handled internally.
  rpc SendMessageToCustomer(SendMessageToCustomerRequest) returns (SendMessageToCustomerResponse) {
    option (google.api.http) = {
      post: "/v1/messages:sendToCustomer"
      body: "*"
    };
  }

  // Sends an auto message to a customer.
  //
  // Triggers a template-based auto message (e.g. appointment reminder, payment
  // confirmation) to the customer via the configured delivery channels. The message
  // content is derived from the template and optional context (e.g. appointment_id).
  rpc SendAutoMessageToCustomer(SendAutoMessageToCustomerRequest) returns (SendAutoMessageToCustomerResponse) {
    option (google.api.http) = {
      post: "/v1/messages:sendAutoMessageToCustomer"
      body: "*"
    };
  }
}

// Content type of the message body.
enum MessageType {
  // Unknown or unspecified message type.
  MESSAGE_TYPE_UNSPECIFIED = 0;
  // Plain text message.
  TEXT = 1;
  // Picture / image message.
  PIC = 2;
}

// Request for SendMessageToCustomer.
message SendMessageToCustomerRequest {
  // Customer id to send the message to (obfuscated id).
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Phone number to use when the customer has multiple phones (e.g. E.164 format).
  // Required when delivery method is CALL or when sending to a specific phone; otherwise optional.
  optional string phone_number = 2;
  // Message body content (e.g. plain text "hello", or reference for PIC type).
  string message_body = 3 [(google.api.field_behavior) = REQUIRED];
  // Message content type: TEXT or PIC. Defaults to TEXT if not set.
  MessageType message_type = 4 [(google.api.field_behavior) = REQUIRED];
  // Delivery method (channel): MSG(1), EMAIL(2), CALL(4), or APP(5). Required for sending.
  MessageDeliveryMethod method = 5 [(google.api.field_behavior) = REQUIRED];
}

// Response for SendMessageToCustomer.
message SendMessageToCustomerResponse {
  // Id of the conversation thread used or created for this customer (for reference).
  optional string thread_id = 1;
  // Id of the sent message, when the backend returns it.
  optional string message_id = 2;
}

// Request for SendAutoMessageToCustomer.
message SendAutoMessageToCustomerRequest {
  // Customer id to send the auto message to (obfuscated id).
  string customer_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Business id for context and template lookup (obfuscated id).
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Use case or template type (e.g. appointment reminder, payment confirmation).
  string use_case = 3 [(google.api.field_behavior) = REQUIRED];
  // Delivery channels to use: MSG(1), EMAIL(2), CALL(4), APP(5). At least one required.
  repeated MessageDeliveryMethod methods = 4 [(google.api.field_behavior) = REQUIRED];
  // Optional context for variable substitution (e.g. appointment_id for reminders).
  optional string context_id = 5;
}

// Response for SendAutoMessageToCustomer.
message SendAutoMessageToCustomerResponse {}
