  //    // the group class service detail
  //    GroupClassServiceDetailModel service = 1;
  //  }

  // Booking request source definition
  enum Source {
    // unspecified
    SOURCE_UNSPECIFIED = 0;
    // Created by business
    BUSINESS = 1;
    // Created by online booking
    OB = 2;
    // Created by membership, source id is membership id
    MEMBERSHIP = 3;
  }

  // The booking request note model
  message Note {
    // id
    int64 id = 1;
    // company id
    int64 company_id = 2;
    // customer id
    int64 customer_id = 3;
    // question name
    string note = 4;
    // customer id
    int64 booking_request_id = 5;
    // createdAt
    google.protobuf.Timestamp created_at = 6;
    // updatedAt
    google.protobuf.Timestamp updated_at = 7;
  }
}
