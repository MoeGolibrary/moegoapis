  //    // the feedings
  //    repeated FeedingModel feedings = 6;
  //    // the medications
  //    repeated MedicationModel medications = 7;
  //    // Boarding waitlist
  //    optional BoardingServiceWaitlistModel waitlist = 8;
  //  }
  //
