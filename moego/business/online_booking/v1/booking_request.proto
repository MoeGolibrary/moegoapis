option java_multiple_files = true;
option java_outer_classname = "BookingRequestServiceProto";
option java_package = "com.moego.api.business.online_booking.v1";

// BookingRequest represents a service appointment request made through digital channels.
// These bookings can be made through the customer portal, mobile app, or website.
// Each booking includes service details, timing preferences, and customer information
// needed to schedule the appointment.
message BookingRequest {
  // Status represents the current state of the online booking request.
  // This affects how the booking is processed and displayed in the system.
  enum Status {
    // unspecified
    BOOKING_REQUEST_STATUS_UNSPECIFIED = 0;
    // The user submitted it from online booking, but the business did not process it.
    SUBMITTED = 1;
    // moved to wait list
    WAIT_LIST = 2;
    // business accepts and scheduled to an appointment
    SCHEDULED = 3;
    // business rejects the booking request, it will be displayed in the canceled list.
    DECLINED = 4;
    // business deletes the booking request, it won't show up on any lists
    DELETED = 5;
  }

  // payment status definition
  enum PaymentStatus {
    // unspecified
    PAYMENT_STATUS_UNSPECIFIED = 0;
    // no payment
    // B 端没有开启 prepay
    NO_PAYMENT = 1;
    // waiting: 成功 submit，但是还没触发支付的状态（等待支付）
    // 在 submit 之后，调用 confirm PaymentIntent 之前，payment_status 为 WAITING。
    WAITING = 5;
    // processing
    // 当 C 端 confirm payment 之后，会把 BookingRequest 的 payment_status 设置为 PROCESSING
    PROCESSING = 2;
    // success
    // 当 B 端 accept 或者 auto accept 之后，会去 capture payment，
    // 如果 capture 成功，会把 BookingRequest 的 payment_status 设置为 SUCCESS
    SUCCESS = 3;
    // failed
    // C 端 confirm 失败或者 capture payment 失败，会把 BookingRequest 的 payment_status 设置为 FAILED
    FAILED = 4;
  }

  // Unique identifier for the booking
  // Format: "bkg_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the business location for the service
  // Required. Must be a valid business ID
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];

  // ID of the customer making the booking
  // Required. Must be a valid customer ID
  string customer_id = 3 [(google.api.field_behavior) = REQUIRED];

  // ID of the company associated with the booking
  string company_id = 4 [(google.api.field_behavior) = REQUIRED];

  // ID of the appointment associated with the booking
  string appointment_id = 5;

  // Service location details
  // Required for mobile services, optional for in-store appointments
  moego.common.v1.Address address = 6;

  // Requested time window for the service
  // Includes start and end time preferences
  google.type.Interval duration = 7;

  // List of services requested for each pet
  // Details specific services and pets involved
  repeated moego.business.appointment.v1.PetServiceDetail pet_service_details = 8;

  // Current state of the booking request
  // Determines processing flow and display
  Status status = 9;

  // Whether the booking has been prepaid
  bool is_prepaid = 10;

  // Payment status
  PaymentStatus payment_status = 11;

  // Additional note provided by the customer during booking
  string additional_note = 12;

  // Indicates whether the original time slot is now available
  optional bool is_waitlist_expired = 13;
  // Indicates whether the wait list entry has expired
  optional bool is_waitlist_available = 14;

  // When this booking request was created
  // System-generated timestamp
  google.protobuf.Timestamp created_time = 15;

  // Timestamp indicating when the booking request was last modified
  google.protobuf.Timestamp last_updated_time = 16;

  // the services
  repeated Service services = 17;

  // booking request attributes, store some additional information
  Attr attr = 18;

  // Booking request source
  Source source = 19;

  // comment
  Note comment = 25;

  // Booking request attributes
  message Attr {
    // whether the customer is a new visitor
    bool is_new_visitor = 1;

    // 当 source 为 B 端创建时，记录创建 BookingRequest 的 Staff ID
    optional int64 created_by_staff_id = 2;
  }

  // TODO: The booking request service
  message Service {
    //    // the service type
    //    oneof service {
    //      // grooming service
    //      GroomingService grooming = 1;
    //      // boarding service
