syntax = "proto3";

package moego.business.setting.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "moego/business/setting/v1/customer.proto";
import "moego/business/setting/v1/pet.proto";
import "moego/business/setting/v1/lodging.proto";
import "moego/business/setting/v1/service.proto";
import "moego/common/v1/pagination.proto";
import "google/type/money.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/setting/v1/settingpb;settingpb";
option java_multiple_files = true;
option java_outer_classname = "SettingProto";
option java_package = "com.moego.api.business.setting.v1";

// SettingService provides methods for managing business configuration settings.
// This includes pet codes, customer tags, and service definitions that are used
// throughout the system. These settings help standardize data entry and ensure
// consistent service delivery across all business locations.
service SettingService {
  // Lists all available pet codes for a company.
  //
  // Pet codes are used to flag special handling requirements or medical conditions
  // that staff need to be aware of when providing services. These codes are
  // displayed prominently in pet profiles and during service delivery.
  //
  // Returns all active codes for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListPetCodes(ListPetCodesRequest) returns (ListPetCodesResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/pet/codes:list"
      body: "*"
    };
  }

  // Lists all available pet sizes for a company.
  //
  // Pet sizes are used to categorize pets by general size (e.g., Small, Medium, Large)
  // which can be used to customize services, pricing, or handling requirements.
  //
  // Returns all active pet sizes for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListPetSizes(ListPetSizesRequest) returns (ListPetSizesResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/pet/sizes:list"
      body: "*"
    };
  }

  // Lists all available pet types for a company.
  //
  // Pet types are used to categorize pets by species (e.g., Dog, Cat, Bird)
  // which can be used to customize services, pricing, or handling requirements.
  //
  // Returns all active pet types for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListPetTypes(ListPetTypesRequest) returns (ListPetTypesResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/pet/types:list"
      body: "*"
    };
  }

  // Lists all available pet coat types for a company.
  //
  // Pet coat types are used to categorize pets by their fur characteristics (e.g., Short, Long, Curly)
  // which can be used to customize services, pricing, or handling requirements.
  //
  // Returns all active pet coat types for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListPetCoatTypes(ListPetCoatTypesRequest) returns (ListPetCoatTypesResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/pet/coat_types:list"
      body: "*"
    };
  }

  // Lists all available customer tags for a company.
  //
  // Customer tags help categorize clients and can be used for marketing,
  // reporting, and service customization. Tags can indicate preferences,
  // loyalty status, or special handling requirements.
  //
  // Returns all active tags for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListCustomerTags(ListCustomerTagsRequest) returns (ListCustomerTagsResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/customer/tags:list"
      body: "*"
    };
  }

  // Lists all available customer referral sources for a company.
  //
  // Referral sources help track the origin of new customers and analyze marketing effectiveness.
  // These sources can be used for lead generation, marketing campaigns, and customer analytics.
  //
  // Returns all active referral sources for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListCustomerReferralSources(ListCustomerReferralSourcesRequest) returns (ListCustomerReferralSourcesResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/customer/referral_sources:list"
      body: "*"
    };
  }


  // Lists all available lead lifecycle stages for a company.
  //
  // Lifecycle stages help track the progression of leads through the sales pipeline.
  //
  // Returns all active lifecycle stages for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  // Returns INVALID_ARGUMENT if the request is malformed.
  rpc ListLeadsLifeCycles(ListLeadsLifeCyclesRequest) returns (ListLeadsLifeCyclesResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/leads/life_cycles"
      body: "*"
    };
  }

  // Lists all available lead action statuses for a company.
  //
  // Action statuses help track what actions need to be taken on leads.
  //
  // Returns all active action statuses for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  // Returns INVALID_ARGUMENT if the request is malformed.
  rpc ListLeadsActionStatus(ListLeadsActionStatusRequest) returns (ListLeadsActionStatusResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/leads/action_status"
      body: "*"
    };
  }

  // Gets the details of a specific service.
  //
  // Retrieves detailed information about a service identified by its ID.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  // Returns NOT_FOUND if the service does not exist.
  rpc GetService(GetServiceRequest) returns (Service) {
    option (google.api.http) = {get: "/v1/setting/companies/{company_id}/services/{id}"};
  }

  // Lists available services based on specified criteria.
  //
  // Services can be filtered by business location and service type.
  // Results are paginated and can be used for service menu display,
  // appointment booking, and pricing calculations.
  //
  // Returns services matching the filter criteria.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/services:list"
      body: "*"
    };
  }

  // Creates a new service.
  //
  // Adds a new service definition to the system. The service must be associated with
  // a specific company and can optionally belong to one or more business locations.
  //
  // Returns the created service with assigned ID.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  // Returns ALREADY_EXISTS if a service with the same ID already exists.
  rpc CreateService(CreateServiceRequest) returns (Service) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/services"
      body: "*"
    };
  }

  // Updates an existing service.
  //
  // Modifies the details of an existing service. The update may affect all business
  // locations where this service is used.
  //
  // Returns the updated service.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  // Returns NOT_FOUND if the service does not exist.
  rpc UpdateService(UpdateServiceRequest) returns (Service) {
    option (google.api.http) = {
      put: "/v1/setting/companies/{company_id}/services/{id}"
      body: "*"
    };
  }

  // Lists all available lodgings for a company.
  //
  // Lodgings represent different types of accommodation options for pet boarding services.
  //
  // Returns all active lodgings for the specified company.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  // Returns INVALID_ARGUMENT if the request is malformed.
  // Returns NOT_FOUND if the company does not exist.
  rpc ListLodgings(ListLodgingsRequest) returns (ListLodgingsResponse) {
    option (google.api.http) = {
      post: "/v1/setting/companies/{company_id}/lodgings"
      body: "*"
    };
  }

}

// Request message for listing pet codes.
message ListPetCodesRequest {
  // ID of the company to list pet codes for
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing pet codes.
message ListPetCodesResponse {
  // List of available pet codes
  // May be empty if no codes are defined
  repeated PetCode codes = 1;
}

// Request message for listing customer tags.
message ListCustomerTagsRequest {
  // ID of the company to list customer tags for
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing customer tags.
message ListCustomerTagsResponse {
  // List of available customer tags
  // May be empty if no tags are defined
  repeated CustomerTag tags = 1;
}

// Request message for listing customer referral sources.
message ListCustomerReferralSourcesRequest {
  // ID of the company to list referral sources for
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing customer referral sources.
message ListCustomerReferralSourcesResponse {
  // List of available referral sources
  // May be empty if no sources are defined
  repeated ReferralSource referral_sources = 1;
}

// Request message for listing services.
message ListServicesRequest {
  // ID of the company to list services for
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Pagination parameters for the request
  // Required. Defines page size and token for continuation
  moego.common.v1.Pagination pagination = 2 [(google.api.field_behavior) = REQUIRED];

  // List of business locations to filter services by
  // Optional. If empty, returns services from all locations
  repeated string business_ids = 3;

  // Filter parameters for the service list
  message Filter {
    // Types of services to include in the results
    // Optional. If empty, returns all service types
    repeated Service.ItemType item_types = 1 [(google.api.field_behavior) = OPTIONAL];
  }

  // Optional filters to apply to the service list
  Filter filter = 4;
}


// Response message for listing services.
message ListServicesResponse {
  // Token for retrieving the next page of results
  // Empty if there are no more results
  string next_page_token = 1;

  // List of services matching the request criteria
  // May be empty if no services match
  repeated Service services = 2;
}

// Request message for getting a service.
message GetServiceRequest {
  // ID of the company that owns the service
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the service to retrieve
  // Required. Must be a valid service ID
  string id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request message for creating a service.
message CreateServiceRequest {
  // ID of the company to create the service under
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Name of the service (e.g., "Grooming", "Boarding")
  // Required. Should be human-readable and unique within the company
  string name = 2 [(google.api.field_behavior) = REQUIRED];

  // List of business locations where this service is available
  // Optional. If empty, service is available at all locations
  repeated string business_ids = 3;

  // Type of service (e.g., grooming, boarding, daycare)
  // Required. Used for categorization and filtering
  Service.ItemType service_item_type = 4 [(google.api.field_behavior) = REQUIRED];

  // Base price for the service
  // Can be adjusted based on pet size, breed, or add-ons
  google.type.Money price = 5  [(google.api.field_behavior) = REQUIRED];

  // Whether this is a primary service or an add-on
  // Affects how the service can be booked
  Service.Type service_type = 6  [(google.api.field_behavior) = REQUIRED];

  // Duration of the service in minutes
  // Used for scheduling and resource allocation
  int32 service_time = 7;

  // Whether this service is available at all business locations
  // If false, check available_business_ids for specific locations
  bool available_all_business = 8;

  // List of business locations where this service is available
  // Only used when available_all_business is false
  repeated string available_business_ids = 9;

  // Whether this service can be performed by all staff members
  // If false, check available_staff_ids for specific staff
  bool available_all_staff = 10;

  // List of staff members who can perform this service
  // Only used when available_all_staff is false
  repeated string available_staff_ids = 11;
}

// Request message for updating a service.
message UpdateServiceRequest {
  // ID of the company that owns the service
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier of the service to update
  // Required. Must be a valid service ID
  string id = 2 [(google.api.field_behavior) = REQUIRED];

  // Name of the service (e.g., "Grooming", "Boarding")
  // Required. Should be human-readable and unique within the company
  string name = 3 [(google.api.field_behavior) = REQUIRED];

  // List of business locations where this service is available
  // Optional. If empty, service is available at all locations
  repeated string business_ids = 4;

  // Base price for the service
  // Can be adjusted based on pet size, breed, or add-ons
  google.type.Money price = 5 [(google.api.field_behavior) = REQUIRED];

  // Duration of the service in minutes
  // Used for scheduling and resource allocation
  int32 service_time = 6;

  // Whether this service is available at all business locations
  // If false, check available_business_ids for specific locations
  bool available_all_business = 7;

  // List of business locations where this service is available
  // Only used when available_all_business is false
  repeated string available_business_ids = 8;

  // Whether this service can be performed by all staff members
  // If false, check available_staff_ids for specific staff
  bool available_all_staff = 9;

  // List of staff members who can perform this service
  // Only used when available_all_staff is false
  repeated string available_staff_ids = 10;

  // Whether this service is inactive
  bool inactive = 11;
}

// Request message for listing lodgings.
message ListLodgingsRequest {
  // ID of the company to list lodgings for
  // Required. Must be a valid company ID
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing lodgings.
message ListLodgingsResponse {
