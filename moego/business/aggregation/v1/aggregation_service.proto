syntax = "proto3";

package moego.business.aggregation.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/type/date.proto";
import "moego/business/customer/v1/pet.proto";
import "moego/business/setting/v1/service.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/aggregation/v1/aggregationpb;aggregationpb";
option java_multiple_files = true;
option java_outer_classname = "AggregationServiceProto";
option java_package = "com.moego.api.business.aggregation.v1";

// AggregationService provides cross-domain aggregation APIs that compose
// customer, pet, service, and appointment data into unified views.
service AggregationService {
  // Returns client and pet profile by phone number for the given business.
  //
  // Resolves customer by phone, returns minimal customer profile, all pets
  // with feeding/medication/vaccine details, and last/next appointment summaries.
  rpc GetClientPetProfileByPhone(GetClientPetProfileByPhoneParams) returns (GetClientPetProfileByPhoneResult) {
    option (google.api.http) = {
      post: "/v1/aggregation/clients:clientPetProfileByPhone"
      body: "*"
    };
  }
}

// Query client and pet profile by phone (e.g. receptionist or integration scenarios).
message GetClientPetProfileByPhoneParams {
  // Phone number, normalized by caller. Recommended length 7–30 characters.
  string phone_number = 1 [(google.api.field_behavior) = REQUIRED];

  // Business id for the context (obfuscated id).
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Business pet schedule time definition.
// Schedule time in minutes from midnight (e.g. 09:00 AM = 540, 09:30 AM = 570).
message BusinessPetScheduleTimeDef {
  // Schedule time in minutes from midnight. Range 0–1440.
  int32 schedule_time = 1;
  // Extra key-value data (e.g. schedule time label).
  map<string, string> extra_json = 2;
}

// Business pet feeding schedule view.
message BusinessPetFeedingScheduleView {
  // Feeding record id.
  int64 id = 1;
  // Pet id.
  int64 pet_id = 2;
  // Feeding amount, e.g. "1.2", "1/2", "1".
  string feeding_amount = 3;
  // Feeding unit (pet_metadata.metadata_value, metadata_name = 2).
  string feeding_unit = 4;
  // Feeding type (pet_metadata.metadata_value, metadata_name = 3).
  string feeding_type = 5;
  // Feeding source (pet_metadata.metadata_value, metadata_name = 4).
  string feeding_source = 6;
  // Feeding instruction (pet_metadata.metadata_value, metadata_name = 5).
  optional string feeding_instruction = 7;
  // Feeding times in minutes from midnight. 09:00 AM = 540, 09:30 AM = 570, etc.
  repeated BusinessPetScheduleTimeDef feeding_times = 8;
  // Feeding note.
  optional string feeding_note = 9;
}

// Business pet medication schedule view.
message BusinessPetMedicationScheduleView {
  // Medication record id.
  int64 id = 1;
  // Pet id.
  int64 pet_id = 2;
  // Medication amount, e.g. "1.2", "1/2", "1".
  string medication_amount = 3;
  // Medication unit (pet_metadata.metadata_value, metadata_name = 7).
  string medication_unit = 4;
  // Medication name (user input).
  string medication_name = 5;
  // Medication note (user input).
  string medication_note = 6;
  // Medication times in minutes from midnight. 09:00 AM = 540, 09:30 AM = 570, etc.
  repeated BusinessPetScheduleTimeDef medication_times = 7;
}

// Result of GetClientPetProfileByPhone.
message GetClientPetProfileByPhoneResult {
  // Minimal customer profile view.
  message CustomerView {
    // customer id (obfuscated)
    string customer_id = 1;
    // first name
    string first_name = 2;
    // last name
    string last_name = 3;
    // phone number
    string phone_number = 4;
    // email
    optional string email = 5;
  }

  // Pet profile with care/vaccine details.
  message PetView {
    // pet id (obfuscated string in product; raw id for compatibility)
    string pet_id = 1;
    // pet name
    string pet_name = 2;
    // pet type
    moego.business.customer.v1.Pet.Type pet_type = 3;
    // breed
    string breed = 4;
    // breed mixed
    bool breed_mixed = 5;
    // gender
    moego.business.customer.v1.Pet.Gender gender = 6;
    // weight (e.g. "10 kg")
    string weight = 7;
    // coat type
    string coat_type = 8;
    // fixed
    string fixed = 9;
    // birthday
    google.type.Date birthday = 10;
    // evaluation status
    moego.business.customer.v1.Pet.EvaluationStatus evaluation_status = 11;
    // feeding schedules
    repeated BusinessPetFeedingScheduleView feeding_schedules = 21;
    // medication schedules
    repeated BusinessPetMedicationScheduleView medication_schedules = 22;
    // vaccine records (from moego Pet.Vaccination)
    repeated moego.business.customer.v1.Pet.Vaccination vaccine_list = 23;
  }

  // Service detail in one appointment.
  message ServiceDetailView {
    // service id (obfuscated string in product; raw id for compatibility)
    string service_id = 1;
    // service name
    string service_name = 2;
    // service item type
    moego.business.setting.v1.Service.ItemType service_item_type = 3;
    // service duration in minutes
    int32 service_time = 4;
    // service price
    double service_price = 5;
    // assigned staff id
    optional string staff_id = 6;
    // assigned lodging id
    optional string lodging_id = 7;
  }

  // Pet and its services in one appointment.
  message PetServiceDetailView {
    // pet id
    string pet_id = 1;
    // selected services
    repeated ServiceDetailView services = 3;
  }

  // Minimal appointment summary.
  message AppointmentView {
    // appointment id
    string appointment_id = 1;
    // start date
    google.type.Date start_date = 2;
    // start time in minutes from midnight
    int32 start_time = 3;
    // end date
    google.type.Date end_date = 4;
    // end time in minutes from midnight
    int32 end_time = 5;
    // main care type
    moego.business.setting.v1.Service.ItemType main_care_type = 6;
    // pet + services details
    repeated PetServiceDetailView pet_service_details = 11;
  }

  // Matched customer profile.
  optional CustomerView customer = 1;
  // Matched pets with feeding/medication/vaccine details.
  repeated PetView pets = 2;
  // Customer's last appointment.
  optional AppointmentView last_appointment = 3;
  // Customer's next appointment.
  optional AppointmentView next_appointment = 4;
}
