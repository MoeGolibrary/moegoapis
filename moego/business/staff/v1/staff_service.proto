syntax = "proto3";

package moego.business.staff.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "moego/business/staff/v1/staff.proto";
import "moego/common/v1/pagination.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/staff/v1/staffpb;staffpb";
option java_multiple_files = true;
option java_outer_classname = "StaffServiceProto";
option java_package = "com.moego.api.business.staff.v1";

// StaffService provides methods for managing staff members and their associated data.
// This service handles staff profile retrieval and listing operations. Staff members
// are essential for service delivery and business operations management.
service StaffService {
  // Retrieves detailed information about a specific staff member.
  //
  // Returns the complete staff profile including role, permissions, and work locations.
  // This information is used for authentication, authorization, and service assignment.
  //
  // Returns NOT_FOUND if the staff ID doesn't exist.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc GetStaff(GetStaffRequest) returns (Staff) {
    option (google.api.http) = {get: "/v1/staffs/{id}"};
  }

  // Lists staff members matching the specified criteria.
  //
  // Results are paginated and filtered by company ID. This method is typically used
  // for staff management, scheduling, and reporting purposes.
  //
  // Returns an empty list if no staff members match the criteria.
  // Returns PERMISSION_DENIED if the caller lacks access rights.
  rpc ListStaffs(ListStaffsRequest) returns (ListStaffsResponse) {
    option (google.api.http) = {
      post: "/v1/staffs:list"
      body: "*"
    };
  }
}

// Request message for retrieving a specific staff member.
message GetStaffRequest {
  // Unique identifier of the staff member to retrieve
  // Required. Format: "stf_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for listing staff members.
message ListStaffsRequest {
  // Pagination parameters for the request
  // Required. Defines page size and token for continuation
  moego.common.v1.Pagination pagination = 1 [(google.api.field_behavior) = REQUIRED];

  // ID of the company to list staff members for
  // Required. Must be a valid company ID
  string company_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for listing staff members.
message ListStaffsResponse {
  // Token for retrieving the next page of results
  // Empty if there are no more results
  string next_page_token = 1;

  // List of staff members matching the request criteria
  // May be empty if no staff members match
  repeated Staff staffs = 2;
}
