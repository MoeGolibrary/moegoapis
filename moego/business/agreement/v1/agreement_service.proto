syntax = "proto3";

package moego.business.agreement.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "moego/business/agreement/v1/agreement.proto";
import "moego/common/v1/pagination.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/agreement/v1/agreementpb;agreementpb";
option java_multiple_files = true;
option java_outer_classname = "AgreementServiceProto";
option java_package = "com.moego.api.business.agreement.v1";

// The agreement service manages the lifecycle of legal agreements and their
// associated signing records. It provides methods for retrieving agreements,
// generating signing links, and tracking customer consent. This service helps
// businesses maintain compliance and manage their legal documentation.
service AgreementService {
  // Retrieves a specific agreement by its ID.
  //
  // Returns: The complete agreement object including content and templates.
  rpc GetAgreement(GetAgreementRequest) returns (Agreement) {
    option (google.api.http) = {get: "/v1/agreements/{id}"};
  }

  // Lists agreements matching the specified criteria.
  //
  // Returns: A paginated list of agreements ordered by creation time.
  rpc ListAgreements(ListAgreementsRequest) returns (ListAgreementsResponse) {
    option (google.api.http) = {
      post: "/v1/agreements:list"
      body: "*"
    };
  }

  // Generates a signing URL for a specific agreement and customer.
  //
  // Returns: A unique URL where the customer can view and sign the agreement.
  rpc GetAgreementSignLink(GetAgreementSignURLRequest) returns (GetAgreementSignURLResponse) {
    option (google.api.http) = {get: "/v1/agreements/{id}/sign_link"};
  }
}

// Request to retrieve a specific agreement.
message GetAgreementRequest {
  // string, Unique identifier of the agreement
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, Company identifier for access control
  string company_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request to list agreements matching specified criteria.
message ListAgreementsRequest {
  // object(Pagination), Pagination parameters for the request
  moego.common.v1.Pagination pagination = 1 [(google.api.field_behavior) = REQUIRED];

  // string, Company identifier for access control
  string company_id = 2 [(google.api.field_behavior) = REQUIRED];

  // array(string), Optional filter by business locations
  repeated string business_ids = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request to generate a signing URL for an agreement.
message GetAgreementSignURLRequest {
  // string, Agreement to be signed
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, Customer who will sign
  string customer_id = 2 [(google.api.field_behavior) = REQUIRED];

  // string, Business location context
  string business_id = 3 [(google.api.field_behavior) = REQUIRED];
}

// Response containing agreements matching the list criteria.
message ListAgreementsResponse {
  // string, Token for retrieving the next page
  string next_page_token = 1;

  // array(Agreement), List of matching agreements
  repeated Agreement agreement = 2;
}

// Response containing the generated signing URL.
message GetAgreementSignURLResponse {
  // string, Identifier of the agreement record created
  string agreement_record_id = 1;

  // string, URL where the agreement can be signed
  string sign_url = 2;
}
