syntax = "proto3";

package moego.business.appointment.v1;

import "google/type/interval.proto";
import "google/type/money.proto";
import "moego/business/customer/v1/pet.proto";
import "moego/business/setting/v1/service.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/appointment/v1/appointmentpb;appointmentpb";
option java_multiple_files = true;
option java_outer_classname = "PetServiceDetailProto";
option java_package = "com.moego.api.business.appointment.v1";

// The pet service detail object represents the services booked for a specific pet in an appointment.
// Each appointment can include multiple pets, and each pet can receive multiple services.
// This object links pets with their scheduled services and maintains the service-specific details
// such as pricing, duration, and assigned staff.
message PetServiceDetail {
  // object(Pet), The pet receiving the services.
  // Contains pet's basic information, health records, and preferences.
  moego.business.customer.v1.Pet pet = 1;

  // array(ServiceDetail), List of services scheduled for this pet.
  // Each service includes timing, pricing, and staff assignments.
  repeated ServiceDetail service_details = 2;

  // array(EvaluationDetail), List of evaluation details for this pet.
  // Each evaluation detail includes the evaluation result and the evaluation time.
  repeated EvaluationDetail evaluation_details = 3;
}

// The evaluation detail object represents the evaluation result for a specific service.
// It contains the evaluation result and the evaluation time.
message EvaluationDetail {
  // string, Unique identifier for the evaluation.
  // Format: "eva_" followed by random characters
  string id = 1;
  // string, Display name of the evaluation.
  // Example: "Evaluation For Grooming", "Evaluation For Boarding"
  string name = 2;
  // Status of the pet's evaluation for services
  // Determines which services can be provided
  enum EvaluationStatus {
    // Evaluation status not yet determined
    EVALUATION_STATUS_UNSPECIFIED = 0;

    // Pet has passed evaluation and can receive services
    PASS = 1;

    // Pet requires modifications to receive services
    FAIL = 2;
  }
  // Status of the pet's evaluation for services
  EvaluationStatus status = 3;
}

// The service detail object represents a specific service booked for a pet.
// It contains all the information needed to perform the service, including
// timing, pricing, staff assignments, and service-specific parameters.
message ServiceDetail {
  // DateType describes how a recurring add-on applies across an appointment stay.
  enum DateType {
    // Date type is not specified.
    DATE_TYPE_UNSPECIFIED = 0;

    // Applies every day during the stay, excluding the checkout day.
    EVERYDAY = 1;

    // Applies only on the dates listed in specific_dates.
    SPECIFIC_DATE = 2;

    // Applies every day during the stay, including the checkout day.
    EVERYDAY_INCLUDE_CHECKOUT_DAY = 3;

    // Applies every day during the stay, excluding the check-in day.
    EVERYDAY_EXCEPT_CHECKIN_DAY = 4;

    // Applies only on the last day of the stay.
    LAST_DAY = 5;

    // Applies only on the first day of the stay.
    FIRST_DAY = 6;
  }

  // string, Unique identifier for the service.
  // Format: "svc_" followed by random characters
  // Example: "svc_1234567890abcdef"
  string id = 1;

  // string, Display name of the service.
  // Example: "Premium Grooming", "Basic Wash"
  string name = 2;

  // enum(ItemType), Category of service item.
  // References the standardized service types defined in settings.
  setting.v1.Service.ItemType service_item_type = 3;

  // string, Service category for grouping and filtering.
  // Example: "Grooming", "Boarding", "Daycare"
  string category = 4;

  // object(Money), Price for this service instance.
  // May differ from standard price due to customizations or special offers.
  google.type.Money price = 5;

  // object(Interval), Scheduled time window for the service.
  // Includes both start and end time.
  // Used for staff scheduling and customer notifications.
  google.type.Interval duration = 6;

  // array(string), IDs of staff members assigned to this service.
  // Multiple staff may be assigned for complex services.
  // Format: Each ID starts with "staff_"
  repeated string staff_ids = 7;

  // enum(Type), The type of service being provided.
  // Determines service flow and required resources.
  setting.v1.Service.Type service_type = 8;

  // integer, Expected duration of the service in minutes.
  // Used for scheduling and resource allocation.
  int32 service_time = 9;

  // string, Unique identifier for this specific pet's service booking.
  // Links this service to a specific pet in a multi-pet appointment.
  // Format: "psd_" followed by random characters
  // It will be changed when pet service detail is updated or deleted.
  string pet_service_detail_id = 10;

  // string, Unique identifier for the lodging unit.
  // Links this service to a specific lodging unit.
  // Format: "lodgu_" followed by random characters
  string lodging_id = 11;

  // string, Name of the lodging unit.
  // Used for display and lodging unit name.
  string lodging_unit_name = 12;

  // string, Name of the lodging type.
  // Used for display and lodging type name.
  string lodging_type_name = 13;

  // DateType, Scheduling rule for a recurring add-on.
  // Omitted for services without a public recurring schedule.
  optional DateType date_type = 14;

  // array(string), Specific business-local dates on which the add-on applies.
  // Values use the yyyy-MM-dd format and are populated for SPECIFIC_DATE.
  repeated string specific_dates = 15;

  // integer, Number of service units on each applicable date.
  optional int32 quantity_per_day = 16;
}
