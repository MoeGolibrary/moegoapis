syntax = "proto3";

package moego.business.appointment.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/type/date.proto";
import "google/type/interval.proto";
import "google/type/money.proto";
import "moego/business/appointment/v1/appointment.proto";
import "moego/business/appointment/v1/appointment_note.proto";
import "moego/business/message/v1/message.proto";
import "moego/business/appointment/v1/grooming_report.proto";
import "moego/business/customer/v1/pet.proto";
import "moego/business/setting/v1/lodging.proto";
import "moego/business/setting/v1/service.proto";
import "moego/common/v1/pagination.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/appointment/v1/appointmentpb;appointmentpb";
option java_multiple_files = true;
option java_outer_classname = "AppointmentServiceProto";
option java_package = "com.moego.api.business.appointment.v1";

// The appointment service provides methods for managing pet service appointments.
// This includes creating new appointments, retrieving appointment details,
// rescheduling appointments, and handling cancellations.
//
// Typical appointment lifecycle:
// 1. Create appointment with CreateAppointment
// 2. Retrieve details with GetAppointment
// 3. Optionally reschedule using RescheduleAppointment
// 4. Cancel if needed with CancelAppointment
//
// All methods require authentication and proper business_id.
service AppointmentService {
  // Retrieves a single appointment by its ID.
  //
  // Returns a detailed appointment object including all services, pet information,
  // and current status. Returns 404 if appointment is not found.
  rpc GetAppointment(GetAppointmentRequest) returns (Appointment) {
    option (google.api.http) = {get: "/v1/appointments/{id}"};
  }

  // Lists appointments matching the specified criteria.
  //
  // Returns a paginated list of appointments. Use filters to narrow results
  // by date range, status, or last update time. Maximum page size: 500.
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse) {
    option (google.api.http) = {
      post: "/v1/appointments:list"
      body: "*"
    };
  }

  // Check appointment availability
  //
  // Returns appointment availability check results.
  // 1. appointment date conflict check result
  // 2. business closed date check result
  rpc CheckAppointmentAvailability(CheckAppointmentAvailabilityRequest) returns (CheckAppointmentAvailabilityResponse) {
    option (google.api.http) = {
      post: "/v1/appointments:check"
      body: "*"
    };
  }

  // Creates a new appointment.
  //
  // Schedules one or more services for specified pets. The appointment will
  // initially be in UNCONFIRMED status. Staff assignments are optional.
  rpc CreateAppointment(CreateAppointmentRequest) returns (Appointment) {
    option (google.api.http) = {
      post: "/v1/appointments"
      body: "*"
    };
  }

  // Reschedules an existing appointment.
  //
  // Updates the appointment's time slot. All services within the appointment
  // will be moved to the new time. Staff assignments may change based on availability.
  rpc RescheduleAppointment(RescheduleAppointmentRequest) returns (Appointment) {
    option (google.api.http) = {
      post: "/v1/appointments/{id}:reschedule"
      body: "*"
    };
  }

  // Cancels an appointment.
  //
  // Sets the appointment status to CANCELED. This action cannot be undone.
  // Notifications will be sent to affected customers and staff.
  rpc CancelAppointment(CancelAppointmentRequest) returns (Appointment) {
    option (google.api.http) = {
      post: "/v1/appointments/{id}:cancel"
      body: "*"
    };
  }

  // Update appointment status
  //
  // Updates the status of an appointment and optionally sends notifications.
  rpc UpdateAppointmentStatus(UpdateAppointmentStatusRequest) returns (Appointment) {
    option (google.api.http) = {
      post: "/v1/appointments/{id}:updateStatus"
      body: "*"
    };
  }

  // List grooming reports of appointments
  rpc ListGroomingReports(ListGroomingReportsRequest) returns (ListGroomingReportsResponse) {
    option (google.api.http) = {
      post: "/v1/grooming_reports:list"
      body: "*"
    };
  }

  // Create an appointment note
  rpc CreateAppointmentNote(CreateAppointmentNoteRequest) returns (AppointmentNote) {
    option (google.api.http) = {
      post: "/v1/appointments/notes"
      body: "*"
    };
  }

  // Update an appointment note
  rpc UpdateAppointmentNote(UpdateAppointmentNoteRequest) returns (AppointmentNote) {
    option (google.api.http) = {
      put: "/v1/appointments/notes/{id}"
      body: "*"
    };
  }

  // List appointment notes
  rpc ListAppointmentNotes(ListAppointmentNotesRequest) returns (ListAppointmentNotesResponse) {
    option (google.api.http) = {
      post: "/v1/appointments/notes:list"
      body: "*"
    };
  }
}

// Request to retrieve a specific appointment.
message GetAppointmentRequest {
  // string, The unique identifier of the appointment to retrieve.
  // Format: "apt_" followed by random characters
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The business location's identifier.
  // Must match the business_id of the appointment.
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request to list appointments matching specified criteria.
message ListAppointmentsRequest {
  // object(Pagination), Pagination parameters.
  // Use page_size to specify results per page (max 500).
  // Use page_token from previous response for next page.
  moego.common.v1.Pagination pagination = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The company identifier for multi-location businesses.
  // Required for company-wide appointment listing.
  string company_id = 2 [(google.api.field_behavior) = REQUIRED];

  // array(string), List of business location IDs to include.
  repeated string business_ids = 3 [(google.api.field_behavior) = REQUIRED];

  // Filter parameters for the appointment list
  message Filter {
    // object(Interval), Filter by appointment start time range.
    google.type.Interval start_time = 1 [(google.api.field_behavior) = OPTIONAL];

    // object(Interval), Filter by appointment end time range.
    google.type.Interval end_time = 2 [(google.api.field_behavior) = OPTIONAL];

    // object(Interval), Filter by last update time range.
    google.type.Interval last_updated_time = 3 [(google.api.field_behavior) = OPTIONAL];

    // array(Status), Filter by appointment status.
    // Example: ["CONFIRMED", "CHECKED_IN"]
    repeated Appointment.Status statuses = 4 [(google.api.field_behavior) = OPTIONAL];

    // object(Interval), Filter by check-in time range.
    google.type.Interval check_in_time = 5 [(google.api.field_behavior) = OPTIONAL];

    // object(Interval), Filter by check-out time range.
    google.type.Interval check_out_time = 6 [(google.api.field_behavior) = OPTIONAL];

    // array(ItemType), Filter by service type.
    repeated setting.v1.Service.ItemType service_types = 7 [(google.api.field_behavior) = OPTIONAL];

    // array(string), Filter by service IDs.
    repeated string service_ids = 8 [(google.api.field_behavior) = OPTIONAL];

    // array(string), Filter by pet IDs.
    repeated string pet_ids = 9 [(google.api.field_behavior) = OPTIONAL];

    // array(string), Filter by customer IDs.
    repeated string customer_ids = 10 [(google.api.field_behavior) = OPTIONAL];
  }

  // object(Filter), Optional filters to narrow the results.
  Filter filter = 4;
}

// Response for listing appointments
message ListAppointmentsResponse {
  // string, Token for retrieving the next page of results.
  // Empty if there are no more results.
  string next_page_token = 1;

  // array(Appointment), List of appointments matching the request criteria.
  // Ordered by start time in ascending order.
  repeated Appointment appointments = 2;
}

// Request to check appointment availability
message CheckAppointmentAvailabilityRequest {
  // string, The business location's identifier where services will be provided.
  string business_id = 1 [(google.api.field_behavior) = REQUIRED];

  // object(Interval), Date range for checking availability.
  google.type.Interval date_range = 2 [(google.api.field_behavior) = REQUIRED];

  // array(string), List of pet IDs for which services will be provided.
  repeated string pet_ids = 3 [(google.api.field_behavior) = OPTIONAL];

  // optional(string), The customer's identifier who is booking the appointment.
  string customer_id = 4 [(google.api.field_behavior) = OPTIONAL];

  // optional(string), The appointment identifier to exclude from availability check.
  string appointment_id = 5 [(google.api.field_behavior) = OPTIONAL];

  // array(string), The lodging unit identifiers to check availability for.
  repeated string lodging_unit_ids = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response for check appointment availability
message CheckAppointmentAvailabilityResponse {
  // appointment date conflict check result
  message AppointmentDateConflictCheckResult {
    // array(PetAppointmentsOverview), Appointments that conflict with the requested appointment.
    repeated PetAppointmentsOverview conflicts = 1;
  }

  // pet appointments overview
  message PetAppointmentsOverview {
    // object(Pet), The pet receiving the services.
    // Contains pet's basic information, health records, and preferences.
    moego.business.customer.v1.Pet pet = 1;

    // array(Appointment), Appointments that conflict with the requested appointment.
    repeated Appointment appointments = 2;
  }

  // business closed date check result
  message BusinessClosedDateCheckResult {
    // array(Date), Business closed dates.
    repeated google.type.Date closed_dates = 1;
  }

  // lodging over capacity check result
  message LodgingOverCapacityCheckResult {
    // lodging over capacity list
    repeated moego.business.setting.v1.Lodging lodgings = 1;
  }

  // appointment date conflict check result
  AppointmentDateConflictCheckResult appointment_conflict_check = 1;

  // business closed date check result
  BusinessClosedDateCheckResult business_closed_date_check = 2;

  // lodging over capacity check result
  LodgingOverCapacityCheckResult lodging_over_capacity_check = 3;
}

// Request to create a new appointment
message CreateAppointmentRequest {
  // Details of services requested for a specific pet
  message PetService {
    // string, The unique identifier of the pet receiving services.
    // Must belong to the specified customer.
    string pet_id = 1 [(google.api.field_behavior) = REQUIRED];

    // array(Service), List of services to be provided.
    repeated Service services = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // Individual service booking details
  message Service {
    // string, The unique identifier of the service to be provided.
    // Must be an active service in the business's service list.
    string id = 1 [(google.api.field_behavior) = REQUIRED];

    // object(Interval), The scheduled time window for this service.
    // Must be within business hours and staff availability.
    google.type.Interval duration = 2 [(google.api.field_behavior) = REQUIRED];

    // array(string), Staff member IDs for this service.
    // Required for GROOMING services. Leave empty for BOARDING/DAYCARE.
    repeated string staff_ids = 3;

    // string, The lodging unit identifier for boarding/daycare services.
    // Required for BOARDING services.
    // Optional for DAYCARE services.
    // Not applicable for GROOMING services.
    optional string lodging_id = 4 [(google.api.field_behavior) = OPTIONAL];

    // object(Money), Custom service price.
    // Optional. If not set, the system default price will be used.
    optional google.type.Money price = 5 [(google.api.field_behavior) = OPTIONAL];
  }

  // Initial note to create for the appointment
  message AppointmentNoteInput {
    // string, The note content.
    string note = 1 [(google.api.field_behavior) = REQUIRED];

    // enum(AppointmentNote.Type), The type of the note.
    // Only ALERT_NOTES, COMMENT, and ADDITIONAL are supported.
    AppointmentNote.Type type = 2 [(google.api.field_behavior) = REQUIRED];
  }

  // string, The business location's identifier where services will be provided.
  string business_id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The customer's identifier who is booking the appointment.
  string customer_id = 2 [(google.api.field_behavior) = REQUIRED];

  // array(PetService), Services requested for each pet.
  repeated PetService pet_services = 3 [(google.api.field_behavior) = REQUIRED];

  // bool, Whether to ignore conflicts when scheduling services.
  // If true, services will be scheduled even if there are conflicts.
  // Defaults to true.
  optional bool ignore_conflict = 4 [(google.api.field_behavior) = OPTIONAL];

  // array(AppointmentNoteInput), Initial notes for the appointment. Will be created as
  // appointment notes after the appointment is created.
  repeated AppointmentNoteInput appointment_notes = 5 [(google.api.field_behavior) = OPTIONAL];

  // array(MessageDeliveryMethod), Delivery channels for auto messages (e.g. MSG, EMAIL).
  // When empty or not set, no auto messages will be sent. When specified, auto messages
  // will be sent via the given channels.
  repeated message.v1.MessageDeliveryMethod auto_message_methods = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Request to reschedule an existing appointment
message RescheduleAppointmentRequest {
  // string, The unique identifier of the appointment to reschedule.
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The business location's identifier.
  // Must match the business_id of the appointment.
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];

  // object(Interval), The new time window for the appointment.
  // Must be in the future and within business hours.
  google.type.Interval duration = 3;

  // array(MessageDeliveryMethod), Delivery channels for auto messages (e.g. MSG, EMAIL).
  // When empty or not set, no auto messages will be sent.
  repeated message.v1.MessageDeliveryMethod auto_message_methods = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request to cancel an appointment
message CancelAppointmentRequest {
  // string, The unique identifier of the appointment to cancel.
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The business location's identifier.
  // Must match the business_id of the appointment.
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];

  // array(MessageDeliveryMethod), Delivery channels for auto messages (e.g. MSG, EMAIL).
  // When empty or not set, no auto messages will be sent.
  repeated message.v1.MessageDeliveryMethod auto_message_methods = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request to update appointment status
message UpdateAppointmentStatusRequest {
  // Message method types for notifications
  enum MessageMethod {
    // Unknown or unspecified message method
    MESSAGE_METHOD_UNSPECIFIED = 0;

    // SMS message
    SMS = 1;

    // Email message
    EMAIL = 2;
  }

  // string, The unique identifier of the appointment to update.
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The business location's identifier.
  // Must match the business_id of the appointment.
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];

  // enum(Status), The target status for the appointment.
  Appointment.Status status = 3 [(google.api.field_behavior) = REQUIRED];

  // enum(MessageMethod), The method to use for sending notifications.
  // MESSAGE_METHOD_UNSPECIFIED - Do not send notifications
  MessageMethod message_method = 4 [(google.api.field_behavior) = OPTIONAL];

  // object(CheckOut), Check out details for when status is FINISHED.
  CheckOut check_out = 5 [(google.api.field_behavior) = OPTIONAL];

  // Check out details
  message CheckOut {
    // date, Actual check out date. If provided, updates boarding appointment check out date
    // and corresponding order price.
    google.type.Date end_date = 1 [(google.api.field_behavior) = OPTIONAL];
  }
}

// Request to list grooming reports
message ListGroomingReportsRequest {
  // array(string) , The unique identifier of the appointment. Max: 500
  repeated string appointment_ids = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The business location's identifier.
  // Must match the business_id of the appointment.
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response to list grooming reports
message ListGroomingReportsResponse {
  // array(GroomingReport), The grooming reports.
  repeated GroomingReport grooming_reports = 1;
}

// Request to create an appointment note
message CreateAppointmentNoteRequest {
  // string, The unique identifier of the appointment.
  string appointment_id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The note.
  string note = 2 [(google.api.field_behavior) = REQUIRED];

  // enum(AppointmentNote.Type), The type of note. Only ALERT_NOTES and COMMENT are supported.
  AppointmentNote.Type type = 3 [(google.api.field_behavior) = REQUIRED];
}

// Request to update an appointment note
message UpdateAppointmentNoteRequest {
  // string, The unique identifier of the appointment notes
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // string, The note.
  string note = 2 [(google.api.field_behavior) = REQUIRED];
}

// Request to list appointment notes
message ListAppointmentNotesRequest {
  // string, The unique identifier of the appointment.
  string appointment_id = 1 [(google.api.field_behavior) = REQUIRED];

  // enum(AppointmentNote.Type), The type of note.
  AppointmentNote.Type type = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response to list appointment notes
message ListAppointmentNotesResponse {
  // array(AppointmentNote), The appointment notes.
  repeated AppointmentNote notes = 1;
}
