syntax = "proto3";

package moego.business.offering.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/type/date.proto";
import "google/type/money.proto";
import "moego/business/setting/v1/service.proto";

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/business/offering/v1/offeringpb;offeringpb";
option java_multiple_files = true;
option java_outer_classname = "OfferingServiceProto";
option java_package = "com.moego.api.business.offering.v1";

// OfferingService provides APIs for querying available offerings and inventory.
//
// It returns which services can be booked for given pets at a business (ListApplicableServices)
// and which lodging units have capacity for a given date (GetAvailableLodgings). Used by both
// staff tools and C-end flows (e.g. online booking) to list what is bookable and in stock.
service OfferingService {
  // Lists services applicable/available for given pets at a business.
  //
  // Returns a flat list of services (and effective availability) for the requested care type
  // (grooming/boarding/daycare etc.) and optional date range. When service_type is ADDON,
  // pass selected_service_ids to filter add-ons that apply to the chosen primary services.
  // Response includes an overall service list and optionally a per-pet breakdown (pet_services).
  rpc ListApplicableServices(ListApplicableServicesRequest) returns (ListApplicableServicesResponse) {
    option (google.api.http) = {
      post: "/v1/offerings/services:listApplicable"
      body: "*"
    };
  }

  // Returns lodgings with availability (inventory) for the given date.
  //
  // Use when booking boarding or daycare to show which lodging units have capacity.
  // Each entry indicates whether the lodging is available; when not available,
  // unavailable_reason describes the cause (e.g. over capacity, date conflict).
  rpc GetAvailableLodgings(GetAvailableLodgingsRequest) returns (GetAvailableLodgingsResponse) {
    option (google.api.http) = {
      post: "/v1/offerings/lodgings:listAvailable"
      body: "*"
    };
  }
}

// Request for ListApplicableServices.
// Minimal params: business, pets, service/addon type, care type, optional date range.
message ListApplicableServicesRequest {
  // Business id (obfuscated id). The location where the user is booking.
  string business_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Pet ids (obfuscated id). At least one; all must be already-created pets under the customer.
  repeated string pet_ids = 2 [(google.api.field_behavior) = REQUIRED];
  // Service type: primary SERVICE (standalone) or ADDON (must be booked with a primary service).
  moego.business.setting.v1.Service.Type service_type = 3 [(google.api.field_behavior) = REQUIRED];
  // Care type: grooming, boarding, daycare, evaluation, or training.
  moego.business.setting.v1.Service.ItemType service_item_type = 4 [(google.api.field_behavior) = REQUIRED];
  // When service_type is ADDON, the primary service ids already selected; used to filter applicable add-ons.
  repeated string selected_service_ids = 5;
  // Optional start date for availability (e.g. boarding check-in date).
  optional google.type.Date start_date = 6;
  // Optional end date for availability (e.g. boarding check-out date).
  optional google.type.Date end_date = 7;
}

// Flat service view for list display or AI consumption (no category nesting).
message ServiceView {
  // Service id (obfuscated id).
  string id = 1;
  // Display name of the service.
  string name = 2;
  // Care type: grooming / boarding / daycare / evaluation / training.
  moego.business.setting.v1.Service.ItemType service_item_type = 3;
  // Service type: primary SERVICE or ADDON.
  moego.business.setting.v1.Service.Type service_type = 4;
  // Base price for the service.
  google.type.Money price = 5;
  // Duration of the service in minutes.
  int32 service_time = 6;
  // Optional description or notes for the service.
  string description = 7;
}

// Applicable/available services for a single pet (flat list per pet).
message ServicesByPet {
  // Pet id (obfuscated id).
  string pet_id = 1;
  // Services that are applicable or available for this pet (e.g. by pet type/size/breed).
  repeated ServiceView services = 2;
}

// Response for ListApplicableServices.
// Returns a flat list of services and optionally per-pet breakdown; no category hierarchy.
message ListApplicableServicesResponse {
  // All applicable/available services in a flat list.
  repeated ServiceView services = 1;
  // Ids of services that are currently available in the requested context (for UI highlighting).
  repeated string available_service_ids = 2;
  // Per-pet list of applicable/available services (when multiple pets were requested).
  repeated ServicesByPet pet_services = 3;
}

// Request for GetAvailableLodgings.
// Used when booking boarding/daycare to see which lodging units have capacity.
message GetAvailableLodgingsRequest {
  // Company id (obfuscated id).
  string company_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Business id (obfuscated id). The location to check.
  string business_id = 2 [(google.api.field_behavior) = REQUIRED];
  // Date to check lodging availability (inventory).
  google.type.Date date = 3 [(google.api.field_behavior) = REQUIRED];
  // Optional pet id when checking for a specific pet (e.g. size-based lodging).
  optional string pet_id = 4;
  // Optional selected service ids when checking for a specific booking combination.
  repeated string service_ids = 5;
}

// One lodging unit (or type) with its availability for the requested date.
message LodgingAvailability {
  // Lodging unit or type id (obfuscated id).
  string lodging_id = 1;
  // Display name of the lodging.
  string lodging_name = 2;
  // Whether this lodging is available (has capacity) for the requested date.
  bool available = 3;
  // Reason when not available (e.g. over capacity, conflict). Empty when available is true.
  string unavailable_reason = 4;
}

// Response for GetAvailableLodgings.
message GetAvailableLodgingsResponse {
  // List of lodgings with availability (inventory) for the requested date.
  repeated LodgingAvailability lodgings = 1;
}
