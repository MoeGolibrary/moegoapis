syntax = "proto3";

package moego.common.v1;

option go_package = "github.com/MoeGolibrary/moegoapis/genproto/go/common/v1/commonpb;commonpb";
option java_multiple_files = true;
option java_outer_classname = "TimePeriodProto";
option java_package = "com.moego.api.common.v1";

// TimePeriod represents a period of time with a unit and value.
message TimePeriod {
  // The unit of time for the period.
  enum Unit {
    // UNIT_UNSPECIFIED indicates an unknown or invalid unit.
    UNIT_UNSPECIFIED = 0;

    // DAY indicates the period is measured in days.
    DAY = 1;

    // WEEK indicates the period is measured in weeks.
    WEEK = 2;

    // MONTH indicates the period is measured in months.
    MONTH = 3;

    // YEAR indicates the period is measured in years.
    YEAR = 4;
  }

  // The unit of time for this period.
  Unit unit = 1;

  // The value of the period in the specified unit.
  int32 value = 2;
}